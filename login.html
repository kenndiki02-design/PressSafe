<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#174a3b">
  <title>Sign in | PressSafe</title>
  <link rel="icon" href="./presssafe-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" href="./auth.css">
  <script src="./auth.js" defer></script>
</head>
<body class="auth-body">
  <main class="auth-layout">
    <a class="auth-brand" href="./index.html"><img src="./presssafe-mark.svg" alt=""><span>PressSafe</span></a>
    <section class="auth-panel" aria-labelledby="auth-title">
      <div class="eyebrow">SECURE WORKSPACE</div>
      <h1 id="auth-title">Sign in</h1>
      <p class="page-subtitle">Your role and organization are loaded from your registered profile.</p>
      <div class="auth-feedback" id="auth-feedback" role="status" hidden></div>
      <form id="login-form">
        <div class="field"><label for="email">Work email</label><input id="email" name="email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="12" required></div>
        <button class="button-primary auth-submit" type="submit">Sign in</button>
      </form>
      <p class="auth-switch">New to PressSafe? <a href="./register.html">Create an account</a></p>
      <p class="auth-footnote">Never sign in on a shared device you do not trust. Use your organization's approved account.</p>
    </section>
  </main>
</body>
</html>
